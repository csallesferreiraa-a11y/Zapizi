<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zapizi · Rotina</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#241c24;--mut:#8b818b;--bg:#faf6f4;--a1:#fbd9c6;--a2:#f6b9d0;--a3:#dcc6f2;--hot:#f9b6d3;font-family:'DM Sans',system-ui,sans-serif}
body[data-t=lavanda]{--a1:#e4dcf8;--a2:#cdbff0;--a3:#f3d1e6;--hot:#d6c9f5}
body[data-t=salvia]{--a1:#dbe9d3;--a2:#cfe3df;--a3:#f2e6d0;--hot:#cfe5c4}
*{box-sizing:border-box;margin:0}
body{color:var(--ink);background:var(--bg) linear-gradient(165deg,var(--a1),var(--a2) 45%,var(--a3)) no-repeat;background-size:100% 380px;min-height:100vh;padding-bottom:120px}
button,input,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.03em}
.wrap{max-width:900px;margin:auto;padding:0 18px}
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 24px 48px;background:linear-gradient(180deg,#fff 0,#fff 20%,var(--a3) 55%,var(--a2) 80%,#f7b79d)}
#gate h1{font-size:clamp(2.6rem,9vw,4.5rem);font-weight:500;line-height:1;max-width:560px;color:#fff;text-shadow:0 1px 20px #c58bc844}
#gate p{color:#fff;margin:12px 0 22px;max-width:380px}
#gf{display:flex;gap:10px;max-width:460px;flex-wrap:wrap}
#pw{flex:1;min-width:200px;background:#fff9;border-radius:30px;padding:16px 22px;color:var(--ink);outline:0}
#gf .btn{background:#fff;color:#c0488a;font-weight:600}
#gm{color:#fff;margin-top:10px;min-height:1.2em;font-size:.9rem}
.btn{padding:15px 26px;border-radius:30px;background:var(--ink);color:#fff;font-weight:500}
.btn.ghost{background:#0000;border:1px solid #241c2433;color:var(--ink)}
header{padding:26px 0 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
header small{font-size:.95rem}
header h1{font-size:clamp(2.2rem,7vw,3.2rem);font-weight:800;line-height:1}
.nav button{width:40px;height:40px;border-radius:50%;background:#fff8;font-size:1.2rem}
#strip{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 18px;scrollbar-width:none}
.dp{min-width:56px;flex:1;border-radius:32px;padding:10px 0;background:#fff8;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.dp b{font:800 1.1rem 'Bricolage Grotesque'}.dp span{font-size:.75rem;color:var(--mut)}
.dp.on{background:var(--ink);color:#fff}.dp.on span{color:#cfc6cf}
.dp i{width:5px;height:5px;border-radius:50%;background:#c0488a;position:absolute;bottom:5px}
.sheet{background:#fff;border-radius:30px 30px 0 0;padding:22px 18px 30px;min-height:55vh;box-shadow:0 -10px 40px #7a4a6a14}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tabs button{padding:9px 16px;border-radius:20px;color:var(--mut);font-weight:600}
.tabs .on{background:#f3f1f1;color:var(--ink)}
.row{display:grid;grid-template-columns:54px 1fr;gap:10px;margin-bottom:12px}
time{font-size:.82rem;color:var(--mut);padding-top:8px}
.card{background:#f3f1f1;border-radius:24px;padding:16px 16px 16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.card.hot{background:var(--hot)}.card.dn h3{text-decoration:line-through;opacity:.5}
.card small{font-size:.8rem;color:#5a4f5a}
.card h3{font-size:1.3rem;line-height:1.1;font-weight:700;margin-top:4px}
.go{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-size:1.1rem}
.empty{color:var(--mut);padding:30px 0;max-width:320px}
.fab{position:fixed;right:max(18px,calc(50% - 440px));bottom:92px;width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;font-size:1.8rem;box-shadow:0 8px 24px #241c2440;z-index:4}
.dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);border-radius:32px;padding:6px;display:flex;z-index:5}
.dock button{color:#cfc6cf;padding:11px 18px;border-radius:26px;font-size:.92rem}
.dock .on{background:#fff;color:var(--ink);font-weight:600}
.panel{background:#fff;border-radius:30px;padding:20px;margin-top:10px}
.gw{position:relative;margin-top:14px}
.wk,#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk span{text-align:center;font-size:.78rem;color:var(--mut);padding-bottom:6px}
.c{min-height:62px;border-radius:16px;background:#f7f4f4;padding:7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.c.o{background:none}.c.td{background:var(--hot)}
.c b{font-weight:600}.c em{font-style:normal;color:#c0488a;letter-spacing:2px}
#sl{position:absolute;inset:0;pointer-events:none}
.st{position:absolute;font-size:2rem;pointer-events:auto;cursor:grab;touch-action:none;user-select:none}
.st svg,.tray svg{height:58px;width:auto;display:block;filter:drop-shadow(2px 0 0 #fff8ec) drop-shadow(-2px 0 0 #fff8ec) drop-shadow(0 2px 0 #fff8ec) drop-shadow(0 -2px 0 #fff8ec) drop-shadow(0 3px 4px #3a24302e)}
.tray svg{height:46px}
.tray{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.tray button{padding:10px 12px;border-radius:18px;background:#f7f4f4}
.hint{font-size:.85rem;color:var(--mut)}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
#bd{position:relative;min-height:70vh;background:#fff;border-radius:30px;overflow:hidden;background-image:radial-gradient(#e9dfe5 1.2px,transparent 1.2px);background-size:22px 22px}
.note,.pic{position:absolute;box-shadow:0 8px 18px #3a24301f;touch-action:none}
.note{width:180px;min-height:150px;border-radius:4px 4px 18px 4px}
.pic{width:190px;background:#fff;padding:8px 8px 4px;border-radius:4px}
.pic img{width:100%;display:block;border-radius:2px}
.pic figcaption{font:500 .85rem 'Bricolage Grotesque';padding:8px 4px;min-height:30px;outline:0;text-align:center}
.nh{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;cursor:grab;color:#0006;touch-action:none}
.x{font-size:1.1rem;color:#0008;width:24px;height:24px}
.nt{padding:4px 14px 16px;outline:0;font-size:1rem;line-height:1.35;min-height:100px;white-space:pre-wrap}
.set label{display:block;font-weight:600;margin:16px 0 6px}
.set input[type=text],dialog input,dialog select{width:100%;background:#f3f1f1;border-radius:16px;padding:13px 16px}
.sw{display:flex;gap:10px}.sw button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0002}
dialog{border:0;border-radius:28px;padding:24px;width:min(420px,92vw);margin:auto;box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#241c2455}
dialog label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 5px}
dialog .a{display:flex;gap:8px;margin-top:20px}
@media(max-width:560px){.c{min-height:52px;padding:5px}.dock button{padding:10px 13px}}
</style>
</head>
<body data-t="pessego">

<div id="gate">
  <h1 id="gt"></h1>
  <p id="gp"></p>
  <form id="gf"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password" aria-label="Senha"><button class="btn" id="gb">Entrar</button></form>
  <div id="gm" role="alert"></div>
</div>

<div id="app" hidden>
  <div class="wrap">
    <section class="v" id="v-hoje">
      <header>
        <div><small id="hi"></small><h1 id="mt"></h1></div>
        <div class="nav"><button id="pw1" aria-label="Semana anterior">‹</button><button id="nw1" aria-label="Próxima semana">›</button></div>
      </header>
    </section>
  </div>
  <div id="strip-wrap" class="wrap" style="padding:0"><div id="strip"></div></div>
  <div class="wrap" style="padding:0">
    <section class="v" id="v-hoje2">
      <div class="sheet">
        <div class="tabs"><button id="tu" data-tab="up"></button><button id="td" data-tab="dn"></button></div>
        <div id="list"></div>
      </div>
    </section>
  </div>

  <div class="wrap">
    <section class="v" id="v-agenda" hidden>
      <header><div><small>Sua agenda</small><h1 id="am"></h1></div><div class="nav"><button id="pm" aria-label="Mês anterior">‹</button><button id="nm" aria-label="Próximo mês">›</button></div></header>
      <div class="panel">
        <div class="wk"><span>dom</span><span>seg</span><span>ter</span><span>qua</span><span>qui</span><span>sex</span><span>sáb</span></div>
        <div class="gw"><div id="grid"></div><div id="sl"></div></div>
        <div class="tray" id="tray"></div>
        <p class="hint">Toque num sticker para colar no mês, arraste para onde quiser e clique duas vezes para remover.</p>
        <div class="tool"><button class="btn ghost" id="clrst">Limpar stickers do mês</button></div>
      </div>
    </section>

    <section class="v" id="v-mural" hidden>
      <header><div><small>Seu espaço</small><h1>Mural</h1></div></header>
      <div class="tool"><button class="btn" id="addn">＋ Post-it</button><button class="btn ghost" id="addi">＋ Imagem</button><input type="file" id="fi" accept="image/*" hidden></div>
      <div id="bd"></div>
    </section>

    <section class="v set" id="v-ajustes" hidden>
      <header><div><small>Do seu jeito</small><h1>Ajustes</h1></div></header>
      <div class="panel">
        <label for="nm2">Seu nome</label><input type="text" id="nm2">
        <label>Cores</label>
        <div class="sw"><button data-t="pessego" style="background:linear-gradient(135deg,#fbd9c6,#f6b9d0)" aria-label="Pêssego"></button><button data-t="lavanda" style="background:linear-gradient(135deg,#e4dcf8,#cdbff0)" aria-label="Lavanda"></button><button data-t="salvia" style="background:linear-gradient(135deg,#dbe9d3,#cfe3df)" aria-label="Sálvia"></button></div>
        <label>Conta</label>
        <div class="tool" style="margin:0"><button class="btn ghost" id="cpw">Trocar senha</button><button class="btn ghost" id="out">Sair</button></div>
        <label>Dados</label>
        <div class="tool" style="margin:0"><button class="btn ghost" id="exp">Baixar backup</button><button class="btn ghost" id="rst">Começar do zero</button></div>
      </div>
    </section>
  </div>

  <button class="fab" id="fab" aria-label="Nova tarefa">＋</button>
  <nav class="dock"><button data-v="hoje">Hoje</button><button data-v="agenda">Agenda</button><button data-v="mural">Mural</button><button data-v="ajustes">Ajustes</button></nav>
</div>

<dialog id="dlg">
  <form id="tf" method="dialog">
    <h2 id="dt">Nova tarefa</h2>
    <label for="f-t">O que precisa ser feito?</label><input id="f-t" required>
    <label for="f-d">Dia</label><input id="f-d" type="date" required>
    <label for="f-h">Horário</label><input id="f-h" type="time">
    <label for="f-c">Categoria</label><select id="f-c"><option>Trabalho</option><option>Reunião</option><option>Conteúdo</option><option>Pessoal</option></select>
    <div class="a"><button class="btn">Salvar</button><button type="button" class="btn ghost" id="f-x">Excluir</button><button type="button" class="btn ghost" id="f-n">Cancelar</button></div>
  </form>
</dialog>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K='zapizi-v2',
uid=()=>Math.random().toString(36).slice(2,9),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
cap=s=>s[0].toUpperCase()+s.slice(1),iso=d=>d.toLocaleDateString('sv'),pd=s=>new Date(s+'T12:00');
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{name:'Carol',pin:'',theme:'pessego',tasks:[],notes:[],imgs:[],stk:{}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Sem espaço no navegador. Use imagens menores ou apague algumas.')}};
let sel=iso(new Date()),tab='up',cur=new Date(),view='hoje';

/* ---------- entrada ---------- */
async function H(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function gate(){
  $('#gt').textContent=S.pin?`Oi, ${S.name}. Pronta para organizar o dia?`:'Vamos criar o seu cantinho.';
  $('#gp').textContent=S.pin?'Digite sua senha para entrar.':'Escolha uma senha para que só você acesse.';
  $('#gb').textContent=S.pin?'Entrar':'Criar senha';
}
$('#gf').onsubmit=async e=>{e.preventDefault();const v=$('#pw').value,h=await H(v);
  if(!S.pin){if(v.length<4)return $('#gm').textContent='Use pelo menos 4 caracteres.';S.pin=h;save()}
  else if(h!==S.pin)return $('#gm').textContent='Senha incorreta. Tente de novo.';
  sessionStorage.in=1;enter()};
function enter(){$('#gate').hidden=true;$('#app').hidden=false;document.body.dataset.t=S.theme;go('hoje')}

/* ---------- navegação ---------- */
function go(v){view=v;
  $$('.v').forEach(s=>s.hidden=!s.id.startsWith('v-'+v));
  $('#strip-wrap').hidden=v!='hoje';$('#fab').hidden=v!='hoje';
  $$('.dock button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
  document.body.style.backgroundSize=v=='hoje'?'100% 420px':'100% 260px';
  ({hoje:rHoje,agenda:rAgenda,mural:rMural,ajustes:rAjustes})[v]()}
$('.dock').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};

/* ---------- hoje ---------- */
function rHoje(){
  const d=pd(sel),h=new Date().getHours();
  $('#hi').textContent=`${h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}, ${S.name}`;
  $('#mt').textContent=cap(d.toLocaleDateString('pt-BR',{month:'long'}))+' '+d.getFullYear();
  const s0=new Date(d);s0.setDate(d.getDate()-d.getDay());
  $('#strip').innerHTML=[...Array(7)].map((_,i)=>{const x=new Date(s0);x.setDate(s0.getDate()+i);const k=iso(x);
    return `<button class="dp ${k==sel?'on':''}" data-d="${k}"><b>${x.getDate()}</b><span>${x.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</span>${S.tasks.some(t=>t.date==k)?'<i></i>':''}</button>`}).join('');
  const all=S.tasks.filter(t=>t.date==sel).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')),
  up=all.filter(t=>!t.done),dn=all.filter(t=>t.done),list=tab=='up'?up:dn;
  $('#tu').textContent=`Próximas (${up.length})`;$('#td').textContent=`Concluídas (${dn.length})`;
  $('#tu').classList.toggle('on',tab=='up');$('#td').classList.toggle('on',tab=='dn');
  $('#list').innerHTML=list.map((t,i)=>`<div class="row"><time>${t.time||''}</time><article class="card ${tab=='up'&&i==0?'hot':''} ${t.done?'dn':''}" data-id="${t.id}"><div><small>${esc(t.cat)}</small><h3>${esc(t.title)}</h3></div><button class="go" data-go="${t.id}" aria-label="${t.done?'Reabrir':'Concluir'}">${t.done?'✓':'↗'}</button></article></div>`).join('')
   ||`<p class="empty">${tab=='up'?'Nada marcado para este dia. Toque em ＋ para criar a primeira tarefa.':'Nenhuma tarefa concluída neste dia ainda.'}</p>`;
}
const shift=n=>{const d=pd(sel);d.setDate(d.getDate()+n);sel=iso(d);rHoje()};
$('#pw1').onclick=()=>shift(-7);$('#nw1').onclick=()=>shift(7);
$('#strip').onclick=e=>{const b=e.target.closest('.dp');if(b){sel=b.dataset.d;rHoje()}};
$('.tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;rHoje()}};
$('#list').onclick=e=>{
  const g=e.target.closest('[data-go]');
  if(g){const t=S.tasks.find(x=>x.id==g.dataset.go);t.done=!t.done;save();return rHoje()}
  const c=e.target.closest('.card');if(c)openT(S.tasks.find(x=>x.id==c.dataset.id))};

/* ---------- tarefa (janela) ---------- */
const dlg=$('#dlg');let editing=null;
function openT(t){editing=t||null;$('#dt').textContent=t?'Editar tarefa':'Nova tarefa';
  $('#f-t').value=t?t.title:'';$('#f-d').value=t?t.date:sel;$('#f-h').value=t?t.time:'';$('#f-c').value=t?t.cat:'Trabalho';
  $('#f-x').hidden=!t;dlg.showModal()}
$('#fab').onclick=()=>openT();$('#f-n').onclick=()=>dlg.close();
$('#f-x').onclick=()=>{S.tasks=S.tasks.filter(x=>x!==editing);save();dlg.close();rHoje()};
$('#tf').onsubmit=()=>{const v={title:$('#f-t').value.trim(),date:$('#f-d').value,time:$('#f-h').value,cat:$('#f-c').value};
  if(editing)Object.assign(editing,v);else S.tasks.push({id:uid(),done:false,...v});
  save();sel=v.date;rHoje()};

/* ---------- arrastar ---------- */
function drag(handle,el,o,box,pct){
  handle.onpointerdown=e=>{if(e.target.closest('.x'))return;e.preventDefault();handle.setPointerCapture(e.pointerId);
    const r0=el.getBoundingClientRect(),gx=e.clientX-r0.left,gy=e.clientY-r0.top;
    handle.onpointermove=m=>{const r=box.getBoundingClientRect();
      let x=Math.max(0,Math.min(r.width-30,m.clientX-r.left-gx)),y=Math.max(0,Math.min(r.height-30,m.clientY-r.top-gy));
      if(pct){x=x/r.width*100;y=y/r.height*100}
      o.x=x;o.y=y;el.style.left=x+(pct?'%':'px');el.style.top=y+(pct?'%':'px')};
    handle.onpointerup=()=>{handle.onpointermove=handle.onpointerup=null;save()}}}

/* ---------- agenda + stickers ---------- */
const P={pk:'#f4a6b9',dp:'#e0678a',bl:'#f7d3d9',cr:'#fbf1dc',gr:'#2f5d46',br:'#8a5a3b',ink:'#3a2e2e'};
const tx=(l,bg,fg,w,h,fs,f='Fraunces')=>`<svg viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" rx="14" fill="${bg}"/>${l.map((t,i)=>`<text x="${w/2}" y="${h/2+(i-(l.length-1)/2)*fs*1.15+fs*.34}" text-anchor="middle" font-family="${f},serif" font-weight="800" font-size="${fs}" fill="${fg}">${t}</text>`).join('')}</svg>`;
const STK={
 foco:tx(['foco no','que importa'],P.bl,'#c0486f',150,64,20),
 bora:tx(['BORA','FAZER'],P.gr,P.cr,110,64,22),
 consigo:tx(['hoje eu','consigo.'],P.cr,P.gr,120,64,26,'Caveat'),
 feito:tx(['feito é melhor','que perfeito'],P.pk,'#fff8ee',160,64,19),
 passo:tx(['um passo','de cada vez'],P.ink,P.cr,150,64,19),
 brilhar:tx(['dia de brilhar ✦'],P.cr,'#c0486f',170,42,19),
 reuniao:tx(['reunião','importante'],P.gr,P.bl,140,64,19),
 chefe:`<svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="43" fill="${P.ink}" stroke="${P.pk}" stroke-width="4"/><text x="45" y="42" text-anchor="middle" font-family="Fraunces,serif" font-weight="800" font-size="19" fill="${P.cr}">MODO</text><text x="45" y="64" text-anchor="middle" font-family="Fraunces,serif" font-weight="800" font-size="19" fill="${P.pk}">CHEFE</text></svg>`,
 feitoo:`<svg viewBox="0 0 80 100"><path d="M24 62L16 96l18-8 6 10 4-34zM56 62l8 34-18-8-6 10-4-34z" fill="${P.dp}"/><circle cx="40" cy="38" r="34" fill="${P.pk}" stroke="${P.cr}" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/><text x="40" y="45" text-anchor="middle" font-family="Fraunces,serif" font-weight="800" font-size="19" fill="#fff8ee">feito!</text></svg>`,
 laco:`<svg viewBox="0 0 80 62"><path d="M40 30C28 6 4 6 6 26s24 22 34 4zM40 30C52 6 76 6 74 26S50 52 40 30z" fill="${P.pk}"/><path d="M40 30L22 56M40 30L58 56" stroke="${P.dp}" stroke-width="7" stroke-linecap="round"/><circle cx="40" cy="30" r="9" fill="${P.dp}"/></svg>`,
 cafe:`<svg viewBox="0 0 84 76"><ellipse cx="40" cy="66" rx="34" ry="8" fill="${P.cr}" stroke="${P.gr}" stroke-width="3"/><path d="M16 28h44v14a22 22 0 0 1-44 0z" fill="${P.bl}" stroke="${P.gr}" stroke-width="3"/><path d="M60 32h6a8 8 0 0 1 0 16h-8" fill="none" stroke="${P.gr}" stroke-width="3"/><ellipse cx="38" cy="28" rx="22" ry="5" fill="${P.br}"/><path d="M30 16c-4-4 4-6 0-11M45 16c-4-4 4-6 0-11" stroke="${P.gr}" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,

$('#tray').innerHTML=Object.entries(STK).map(([k,v])=>`<button data-e="${k}" aria-label="Sticker ${k}">${v}</button>`).join('');
const ym=()=>cur.getFullYear()+'-'+(cur.getMonth()+1);
function rAgenda(){
  const y=cur.getFullYear(),m=cur.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),hj=iso(new Date());let h='';
  $('#am').textContent=cap(cur.toLocaleDateString('pt-BR',{month:'long'}))+' '+y;
  for(let i=0;i<f;i++)h+='<div class="c o"></div>';
  for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d)),c=S.tasks.filter(t=>t.date==k).length;
    h+=`<button class="c ${k==hj?'td':''}" data-d="${k}"><b>${d}</b><em>${'•'.repeat(Math.min(c,3))}</em></button>`}
  $('#grid').innerHTML=h;
  const L=S.stk[ym()]||[];
  $('#sl').innerHTML=L.map(s=>`<span class="st" data-id="${s.id}" style="left:${s.x}%;top:${s.y}%">${STK[s.e]||s.e}</span>`).join('');
  $$('.st').forEach(el=>{const o=L.find(s=>s.id==el.dataset.id);drag(el,el,o,$('#sl'),true);
    el.ondblclick=()=>{S.stk[ym()]=L.filter(s=>s!==o);save();rAgenda()}});
}
$('#grid').onclick=e=>{const c=e.target.closest('.c[data-d]');if(c){sel=c.dataset.d;go('hoje')}};
$('#pm').onclick=()=>{cur.setMonth(cur.getMonth()-1);rAgenda()};$('#nm').onclick=()=>{cur.setMonth(cur.getMonth()+1);rAgenda()};
$('#tray').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  (S.stk[ym()]??=[]).push({id:uid(),e:b.dataset.e,x:25+Math.random()*40,y:10+Math.random()*50});save();rAgenda()};
$('#clrst').onclick=()=>{if(confirm('Remover todos os stickers deste mês?')){S.stk[ym()]=[];save();rAgenda()}};

/* ---------- mural ---------- */
const NC=['#fde58a','#f9c5d8','#cfe3f5','#d7ecc9','#e3d3f5'];
function rMural(){
  $('#bd').innerHTML=S.notes.map(n=>`<div class="note" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;background:${n.c};transform:rotate(${parseInt(n.id,36)%7-3}deg)"><div class="nh">⠿<button class="x" aria-label="Apagar">×</button></div><div class="nt" contenteditable>${esc(n.txt)}</div></div>`).join('')
   +S.imgs.map(p=>`<figure class="pic" data-id="${p.id}" style="left:${p.x}px;top:${p.y}px;transform:rotate(${parseInt(p.id,36)%5-2}deg)"><div class="nh">⠿<button class="x" aria-label="Apagar">×</button></div><img src="${p.src}" alt=""><figcaption contenteditable data-ph="legenda">${esc(p.cap||'')}</figcaption></figure>`).join('');
  [[S.notes,'.note'],[S.imgs,'.pic']].forEach(([arr,sel])=>$$(sel).forEach(el=>{
    const o=arr.find(x=>x.id==el.dataset.id),hd=el.querySelector('.nh');drag(hd,el,o,$('#bd'),false);
    hd.querySelector('.x').onclick=()=>{arr.splice(arr.indexOf(o),1);save();rMural()};
    const ed=el.querySelector('.nt,figcaption');ed.oninput=()=>{o[ed.classList.contains('nt')?'txt':'cap']=ed.innerText;save()}}));
}
$('#addn').onclick=()=>{S.notes.push({id:uid(),x:20+Math.random()*200,y:20+Math.random()*160,c:NC[S.notes.length%NC.length],txt:''});save();rMural()};
$('#addi').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    S.imgs.push({id:uid(),x:30+Math.random()*180,y:30+Math.random()*120,src:c.toDataURL('image/jpeg',.8),cap:''});save();rMural()};im.src=r.result};
  r.readAsDataURL(f);e.target.value=''};

/* ---------- ajustes ---------- */
function rAjustes(){$('#nm2').value=S.name}
$('#nm2').oninput=e=>{S.name=e.target.value||'Carol';save()};
$('.sw').onclick=e=>{const b=e.target.closest('button');if(b){S.theme=document.body.dataset.t=b.dataset.t;save()}};
$('#cpw').onclick=async()=>{const p=prompt('Nova senha (mínimo 4 caracteres):');if(p&&p.length>=4){S.pin=await H(p);save();alert('Senha trocada.')}};
$('#out').onclick=()=>{sessionStorage.clear();location.reload()};
$('#rst').onclick=()=>{if(confirm('Apagar todas as tarefas, post-its, imagens e stickers e começar do zero? Isso não pode ser desfeito.')){
  S.tasks=[];S.notes=[];S.imgs=[];S.stk={};save();go('hoje')}};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='zapizi-backup.json';a.click()};

/* ---------- início ---------- */
gate();if(sessionStorage.in)enter();
</script>
